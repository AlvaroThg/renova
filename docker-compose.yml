services:
  postgres:
    image: postgres:16-alpine
    container_name: renova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: renova
      POSTGRES_PASSWORD: renova
      POSTGRES_DB: renova
    ports:
      - '5432:5432'
    volumes:
      - renova-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renova -d renova']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  renova-pgdata:
